  <style id="lavender-theme">
    :root {
      --paper:#fbf8f3;
      --surface:#fffdfb;
      --ink:#433b4d;
      --muted:#7d7485;
      --teal:#8267a8;
      --teal-soft:#eee8f6;
      --forest:#665477;
      --coral:#df91a6;
      --coral-soft:#f9e1e8;
      --mustard:#d7bd42;
      --yellow:#f2dc68;
      --purple:#9b7abe;
      --purple-soft:#eee5f7;
      --blue:#86a5ba;
      --blue-soft:#e2edf2;
      --mint:#b9decb;
      --mint-soft:#e1f2e9;

    .sun-meta{display:grid;gap:5px;color:#665477}
    .weather-line{color:#5e4b70;max-width:210px}
    .progress-card{background:#fffdfb}
    .ring{background:conic-gradient(var(--coral) calc(var(--p)*1%),#eee8ef 0)}
    .stat{background:#f7f2f8}
    .stat.wide{background:var(--mint-soft);color:#426b58}
    .tag{background:var(--purple-soft);color:#68527c}

    .check.done,.fab,.primary{background:var(--teal);border-color:var(--teal)}

    .quick:nth-child(3){background:#f8edaf}
    .quick:nth-child(4){background:var(--blue-soft)}
    .quick:nth-child(5){background:var(--mint-soft)}
    .quick.checked{box-shadow:inset 0 0 0 2px rgba(91,70,107,.26)}
    .line{background:#ded8e1}
    .line:before{background:var(--teal)}
    .habit-symbol{background:var(--purple-soft);color:#6d5682}
    .dot.on{background:var(--teal)}
    .summary-item:first-child{background:var(--blue-soft)}
    .bar i{background:var(--teal)}
    .quote-card{background:#f7eaa8}
    .chair{border-color:#8d70ad}
    .chair:after{background:#8d70ad}
    .cover{background:var(--purple);box-shadow:4px 5px 0 #dfd3ea}
    .mood-option.active{background:#f4df78}
    .secondary{background:var(--purple-soft);color:#604c73}
    .danger{background:var(--coral-soft);color:#944d61}
    .storage-pill{background:var(--mint-soft);color:#426b58}
    .storage-pill i{background:#5d9a78}
    .bottom-nav{background:rgba(255,253,251,.95);border-color:var(--line)}
    .nav-btn.active{background:var(--purple-soft);color:#6c5283}
    .modal-wrap,.onboarding{background:rgba(54,43,63,.38)}
    input,select,textarea{border-color:#ddd5e1;background:#fffdfb}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline-color:rgba(130,103,168,.28)}

    .lavender-stem:before{content:"";position:absolute;left:-7px;bottom:20%;width:8px;height:18px;border-radius:100% 0 100% 0;background:#83ad8d;transform:rotate(-30deg);box-shadow:9px 10px 0 #77a183}

    .lavender-pot{position:absolute;z-index:3;left:50%;bottom:12px;width:70px;height:34px;transform:translateX(-50%);border-radius:8px 8px 22px 22px;background:#e6a1b3;box-shadow:inset 0 6px 0 rgba(255,255,255,.22)}
    @keyframes lavender-sway{0%,100%{transform:rotate(var(--r)) translateX(0)}50%{transform:rotate(calc(var(--r) + 4deg)) translateX(2px)}}

    @media(prefers-reduced-motion:reduce){.lavender-stem{animation:none!important}}
  </style>
</head>

<svg width="0" height="0" aria-hidden="true" style="position:absolute"><symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol><symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4m8-4v4M3 10h18"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol><symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5Z"/><path d="M4 6.5v13"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 20 4-.8L19 8.2 15.8 5 4.8 16Z"/><path d="m14 6.8 3.2 3.2"/></symbol><symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m3 0-1 14H7L6 7m4 4v6m4-6v6"/></symbol><symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol><symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol><symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol><symbol id="i-run" viewBox="0 0 24 24"><circle cx="14" cy="4" r="2"/><path d="m8 21 3-6 2-3 4 3 2 5M6 12l4-5 4 2 3 1"/></symbol><symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 6h15a2 2 0 0 1 2 2v11H4a2 2 0 0 1-2-2V6a3 3 0 0 1 3-3h13"/><path d="M16 12h5"/></symbol><symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></symbol><symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3S6 10 6 15a6 6 0 0 0 12 0c0-5-6-12-6-12Z"/></symbol></svg>
<main class="app"><div id="view"></div><nav class="bottom-nav" aria-label="主要导航"></nav></main>
<div id="modalRoot"></div><div id="toastRoot"></div><div id="guideRoot"></div>
<script>
const KEY='lavender-life-v1', icon=n=>`<svg class="icon" aria-hidden="true"><use href="#i-${n}"></use></svg>`, id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6), today=()=>new Date().toISOString().slice(0,10);
const seed=()=>({tasks:[{id:id(),name:'完成本周项目方案',time:'09:30',category:'工作',priority:'高',note:'整理重点与下一步',done:true,focus:true,date:today()},{id:id(),name:'午后快走 30 分钟',time:'12:40',category:'健康',priority:'中',note:'河边路线',done:false,focus:true,date:today()},{id:id(),name:'阅读《也许你该找个人聊聊》',time:'21:00',category:'个人成长',priority:'中',note:'读到 42%',done:false,focus:true,date:today()}],quick:{运动:false,阅读:true,存钱:false,喝水:true,心情:false},habits:[{id:id(),name:'早睡',streak:6,week:[1,1,0,1,1,0,0],done:false},{id:id(),name:'早起',streak:12,week:[1,1,1,1,1,0,0],done:true},{id:id(),name:'喝水',streak:8,week:[1,1,1,0,1,0,0],done:true},{id:id(),name:'运动',streak:3,week:[1,0,1,0,0,0,0],done:false},{id:id(),name:'阅读',streak:15,week:[1,1,1,1,1,0,0],done:true},{id:id(),name:'存钱',streak:4,week:[1,0,0,1,0,0,0],done:false},{id:id(),name:'冥想',streak:2,week:[0,1,0,1,0,0,0],done:false}],exercise:[{id:id(),date:today(),type:'快走',minutes:35,calories:168,feeling:'身体轻松，呼吸很顺'}],savings:[{id:id(),name:'旅行基金',saved:6800,target:12000,color:'mustard'},{id:id(),name:'应急金',saved:15000,target:30000,color:'teal'}],savingLogs:[],books:[{id:id(),title:'也许你该找个人聊聊',author:'洛莉·戈特利布',status:'正在读',progress:42,rating:4,note:'每个人都在自己的故事里寻找出口。'}],moods:[{id:id(),date:today(),mood:'平静',event:'按自己的节奏完成了计划。',reason:'今天留出了独处时间',words:'慢一点也没有关系。',gratitude:'一杯热茶\n傍晚的风\n朋友的消息'}],reviews:[],quote:0});
let data=load(), current='home', tab='exercise', search='', filter='全部', storageState='本机持久化';function load(){try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){return seed()}}function save(){let snapshot=JSON.stringify(data);try{localStorage.setItem(KEY,snapshot)}catch(e){}persistSnapshot(snapshot)}function openStorage(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error('indexedDB unavailable'));let r=indexedDB.open('lavender-life-local-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('snapshots');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function readSnapshot(db){return new Promise((resolve,reject)=>{let r=db.transaction('snapshots','readonly').objectStore('snapshots').get('current');r.onsuccess=()=>resolve(r.result||'');r.onerror=()=>reject(r.error)})}function writeSnapshot(db,snapshot){return new Promise((resolve,reject)=>{let r=db.transaction('snapshots','readwrite').objectStore('snapshots').put(snapshot,'current');r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}async function hydrateStorage(){try{let db=await openStorage(),snapshot=await readSnapshot(db);if(snapshot){data=JSON.parse(snapshot);render()}else await writeSnapshot(db,JSON.stringify(data));if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist();storageState='手机本地持久化';render()}catch(e){storageState='本机备份可恢复'}}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(msg){toastRoot.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>toastRoot.innerHTML='',1800)}
const navs=[['home','home','首页'],['plan','cal','计划'],['check','check','打卡'],['record','book','记录'],['mine','user','我的']];function nav(){document.querySelector('.bottom-nav').innerHTML=navs.map(n=>`<button class="nav-btn ${current===n[0]?'active':''}" data-nav="${n[0]}">${icon(n[1])}<span>${n[2]}</span></button>`).join('')}
function render(){({home:renderHome,plan:renderPlan,check:renderCheck,record:renderRecord,mine:renderMine}[current]||renderHome)();nav();scrollTo({top:0,behavior:'smooth'})}const pageHead=(t,s,action='')=>`<header class="page-header"><div><h1>${t}</h1><p>${s}</p></div>${action}</header>`;
function renderHome(){let ts=data.tasks.filter(t=>t.date===today()),done=ts.filter(t=>t.done).length,p=ts.length?Math.round(done/ts.length*100):0,focus=ts.filter(t=>t.focus).slice(0,3);view.innerHTML=`<div class="page"><header class="topbar"><div class="profile"><div class="avatar">青</div><div><div class="eyebrow">${new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(new Date())}</div><div class="greeting">早上好，青青</div></div></div><button class="icon-btn" data-nav="mine" aria-label="打开设置">${icon('user')}</button></header><section class="sun-card card"><div class="sun-copy"><small>今日寄语</small><h1>今天也要<br>好好爱自己。</h1><div class="sun-meta"><span>☀ 26°C</span><span>宜 · 专注当下</span></div></div><div class="window"></div><div class="plant"></div></section><section class="section"><div class="section-head"><h2 class="section-title">今日进度</h2><span class="section-note">连续打卡 12 天</span></div><div class="progress-card card"><div class="ring" style="--p:${p}"><div><strong>${p}%</strong><span>今日完成</span></div></div><div class="progress-stats"><div class="stat"><b>${done}</b><span>已完成</span></div><div class="stat"><b>${Math.max(ts.length-done,0)}</b><span>待完成</span></div><div class="stat wide"><b>12 天</b><span>稳稳向前，保持节奏</span></div></div></div></section><section class="section"><div class="section-head"><h2 class="section-title">最重要的三件事</h2><button class="text-btn" data-add="task">新增</button></div><div class="focus-list">${focus.length?focus.map(taskHTML).join(''):empty('还没有重点任务','添加今天最值得完成的一件事')}</div></section><section class="section"><div class="section-head"><h2 class="section-title">快捷打卡</h2><span class="section-note">轻点即完成</span></div><div class="quick-grid">${[['运动','run'],['阅读','book'],['存钱','wallet'],['喝水','drop'],['心情','smile']].map(q=>`<button class="quick ${data.quick[q[0]]?'checked':''}" data-quick="${q[0]}"><span class="q-icon">${icon(data.quick[q[0]]?'check':q[1])}</span>${q[0]}</button>`).join('')}</div></section><section class="section"><div class="section-head"><h2 class="section-title">今日计划</h2><button class="text-btn" data-nav="plan">查看全部</button></div><div class="timeline">${ts.length?ts.sort((a,b)=>a.time.localeCompare(b.time)).map(t=>`<div class="timeline-item"><span class="time">${esc(t.time)}</span><i class="line"></i><div class="event"><b>${esc(t.name)}</b><p>${esc(t.category)} · ${t.done?'已完成':'待完成'}</p></div></div>`).join(''):empty('今天还没有安排','给今天留下一件想完成的事')}</div></section><section class="section"><div class="section-head"><h2 class="section-title">习惯打卡</h2><button class="text-btn" data-nav="check">管理</button></div><div class="habit-list">${data.habits.slice(0,5).map(habitHTML).join('')}</div></section><section class="section"><div class="section-head"><h2 class="section-title">本周成长摘要</h2><span class="section-note">8月3日 - 8月9日</span></div>${summaryHTML()}</section><section class="quote-card card"><blockquote>“${['把日子过成自己喜欢的样子。','不必很快，稳稳向前就很好。','认真生活的人，自带温柔光芒。'][data.quote%3]}”</blockquote><button class="text-btn" data-quote>换一句</button><div class="chair"></div></section></div>`}
function taskHTML(t){return `<article class="task ${t.done?'done':''}"><button class="check ${t.done?'done':''}" data-toggle-task="${t.id}" aria-label="${t.done?'取消完成':'完成任务'}">${t.done?icon('check'):''}</button><div><div class="task-name">${esc(t.name)}</div><div class="task-meta"><span>${esc(t.time)}</span><span class="tag">${esc(t.category)}</span>${t.priority==='高'?'<span class="tag high">高优先</span>':''}</div></div><div class="task-actions"><button class="mini-btn" data-edit-task="${t.id}" aria-label="编辑">${icon('edit')}</button><button class="mini-btn" data-delete-task="${t.id}" aria-label="删除">${icon('trash')}</button></div></article>`}function habitHTML(h){return `<article class="habit"><span class="habit-symbol">${h.done?icon('check'):icon('cal')}</span><div><b>${esc(h.name)}</b><small>连续 ${h.streak} 天</small></div><div><div class="week-dots">${h.week.map(x=>`<i class="dot ${x?'on':''}"></i>`).join('')}</div><button class="text-btn" data-toggle-habit="${h.id}">${h.done?'已完成':'打卡'}</button></div></article>`}function empty(a,b){return `<div class="empty"><b>${a}</b>${b}</div>`}function summaryHTML(){let mins=data.exercise.reduce((n,x)=>n+Number(x.minutes),0),saved=data.savings.reduce((n,x)=>n+Number(x.saved),0),hp=data.habits.length?Math.round(data.habits.filter(h=>h.done).length/data.habits.length*100):0;return `<div class="summary-grid"><div class="summary-item"><strong>${data.tasks.length?Math.round(data.tasks.filter(t=>t.done).length/data.tasks.length*100):0}%</strong><span>任务完成率</span><div class="bar"><i style="width:${data.tasks.length?Math.round(data.tasks.filter(t=>t.done).length/data.tasks.length*100):0}%"></i></div></div><div class="summary-item"><strong>${mins} 分钟</strong><span>运动时长</span></div><div class="summary-item"><strong>${data.books.reduce((n,b)=>n+(b.progress||0),0)} 页</strong><span>阅读进度</span></div><div class="summary-item"><strong>¥${saved.toLocaleString()}</strong><span>累计存钱</span></div><div class="summary-item"><strong>${hp}%</strong><span>习惯完成率</span></div></div>`}
function renderPlan(){let list=data.tasks.filter(t=>(filter==='全部'||t.category===filter)&&t.name.includes(search));view.innerHTML=`<div class="page">${pageHead('每日计划','把重要的事，放进清晰的时间里。',`<button class="fab" data-add="task" aria-label="新增任务">${icon('plus')}</button>`)}<div class="toolbar"><div class="search">${icon('search')}<input id="taskSearch" value="${esc(search)}" placeholder="搜索任务"></div><select id="taskFilter" class="select"><option>全部</option>${['工作','学习','生活','健康','个人成长'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="list">${list.length?list.sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time)).map(taskHTML).join(''):empty('没有符合条件的任务','试试清除筛选，或新增一个任务')}</div></div>`}
function renderCheck(){let content=tab==='exercise'?exerciseHTML():tab==='saving'?savingHTML():habitsHTML();view.innerHTML=`<div class="page">${pageHead('打卡','记录身体与生活的每一次前进。',`<button class="fab" data-add="${tab}" aria-label="新增记录">${icon('plus')}</button>`)}<div class="segmented"><button class="segment ${tab==='exercise'?'active':''}" data-tab="exercise">运动</button><button class="segment ${tab==='saving'?'active':''}" data-tab="saving">存钱</button><button class="segment ${tab==='habits'?'active':''}" data-tab="habits">习惯</button></div>${content}</div>`}function exerciseHTML(){let mins=data.exercise.reduce((n,x)=>n+Number(x.minutes),0);return `<div class="summary-grid section"><div class="summary-item"><strong>${data.exercise.length} 次</strong><span>本周运动</span><div class="bar"><i style="width:${Math.min(data.exercise.length/4*100,100)}%"></i></div></div><div class="summary-item"><strong>${mins} 分钟</strong><span>累计时长</span></div><div class="summary-item"><strong>${data.exercise.reduce((n,x)=>n+Number(x.calories),0)} 千卡</strong><span>消耗热量</span></div></div><div class="list">${data.exercise.length?data.exercise.map(x=>`<article class="record-card card"><div class="record-top"><div><h3>${esc(x.type)}</h3><p>${esc(x.date)} · ${esc(x.feeling)}</p></div><button class="mini-btn" data-delete-record="exercise:${x.id}">${icon('trash')}</button></div><div class="record-metrics"><span class="metric"><b>${x.minutes}</b><span>分钟</span></span><span class="metric"><b>${x.calories}</b><span>千卡</span></span></div></article>`).join(''):empty('还没有运动记录','从一次十分钟散步开始')}</div>`}function savingHTML(){return `<div class="list">${data.savings.length?data.savings.map(g=>`<article class="goal card"><div class="goal-head"><strong>${esc(g.name)}</strong><button class="mini-btn" data-delete-record="savings:${g.id}">${icon('trash')}</button></div><div class="amount">¥${Number(g.saved).toLocaleString()}</div><small>目标 ¥${Number(g.target).toLocaleString()} · 还差 ¥${Math.max(g.target-g.saved,0).toLocaleString()}</small><div class="bar"><i style="width:${Math.min(g.saved/g.target*100,100)}%"></i></div><button class="text-btn" data-deposit="${g.id}">存一笔</button></article>`).join(''):empty('还没有存钱目标','为下一次旅行或安心生活建个目标')}</div>`}function habitsHTML(){return `<div class="list">${data.habits.length?data.habits.map(habitHTML).join(''):empty('还没有习惯','添加一个想慢慢养成的小习惯')}</div>`}
function renderRecord(){view.innerHTML=`<div class="page">${pageHead('记录','阅读、情绪与每周复盘都在这里。')}<div class="segmented"><button class="segment ${tab==='books'?'active':''}" data-tab="books">阅读</button><button class="segment ${tab==='moods'?'active':''}" data-tab="moods">心情</button><button class="segment ${tab==='review'?'active':''}" data-tab="review">复盘</button></div>${tab==='moods'?moodsHTML():tab==='review'?reviewHTML():booksHTML()}</div>`}function booksHTML(){return `<button class="primary full" data-add="book">添加阅读记录</button><div class="list section">${data.books.length?data.books.map(b=>`<article class="book card"><div class="cover">${esc(b.title.slice(0,8))}</div><div><h3>${esc(b.title)}</h3><p>${esc(b.author)} · ${esc(b.status)}</p><div class="bar"><i style="width:${b.progress}%"></i></div><p>${b.progress}% · ${'★'.repeat(b.rating||0)}</p></div><button class="mini-btn" data-delete-record="books:${b.id}">${icon('trash')}</button></article>`).join(''):empty('书架还是空的','添加一本正在读或想读的书')}</div>`}function moodsHTML(){let m=data.moods[0];return `<button class="primary full" data-add="mood">写今天的心情</button><div class="section">${m?`<article class="record-card card"><div class="record-top"><div><h3>${m.mood==='开心'?'😊':m.mood==='平静'?'😌':m.mood==='充实'?'✨':m.mood==='疲惫'?'😮‍💨':m.mood==='焦虑'?'🌧️':'😔'} ${esc(m.mood)}</h3><p>${esc(m.date)} · ${esc(m.event)}</p></div><button class="mini-btn" data-delete-record="moods:${m.id}">${icon('trash')}</button></div><p><b>想对自己说：</b>${esc(m.words)}</p></article>`:empty('今天还没有心情记录','给情绪一个被看见的位置')}</div>`}function reviewHTML(){return `<article class="review-card card"><div class="section-head"><h2 class="section-title">选择复盘时间段</h2></div><div class="date-row"><div class="field"><label>开始日期</label><input type="date" id="reviewStart" value="${new Date(Date.now()-6*864e5).toISOString().slice(0,10)}"></div><div class="field"><label>结束日期</label><input type="date" id="reviewEnd" value="${today()}"></div></div><button class="primary full" data-calc-review>生成统计</button><div id="reviewResult"></div></article><div class="section"><div class="section-head"><h2 class="section-title">已保存复盘</h2></div><div class="list">${data.reviews.length?data.reviews.map(r=>`<article class="record-card card"><h3>${r.start} 至 ${r.end}</h3><p>${esc(r.satisfied)} · 下阶段：${esc(r.improve)}</p></article>`).join(''):empty('还没有保存的复盘','选择任意时间段，看看自己的变化')}</div></div>`}
function renderMine(){view.innerHTML=`<div class="page">${pageHead('我的','管理这本只属于你的生活手册。')}<section class="sun-card card" style="min-height:145px"><div class="sun-copy"><small>薰衣簿用户</small><h1 style="font-size:24px">青青的生活<br>正在慢慢发光</h1></div><div class="window" style="height:105px"></div></section><div class="section settings-list"><button class="setting" data-guide><div><span>首次使用引导</span><small>重新查看核心操作</small></div>${icon('arrow')}</button><button class="setting" data-export><div><span>导出数据</span><small>备份为 JSON 文件</small></div>${icon('arrow')}</button><button class="setting" data-clear><div><span style="color:#a64733">模拟数据清零</span><small>删除任务、记录和打卡数据</small></div>${icon('trash')}</button></div><p class="section-note" style="text-align:center">数据仅保存在当前设备 · 薰衣簿 v1.0</p></div>`}
function openModal(title,body,kind,edit=''){modalRoot.innerHTML=`<div class="modal-wrap"><section class="modal" role="dialog" aria-modal="true"><header class="modal-head"><h2>${title}</h2><button class="close" data-close aria-label="关闭">×</button></header><form id="entryForm" data-kind="${kind}" data-edit="${edit}">${body}<div class="form-actions"><button type="button" class="secondary" data-close>取消</button><button class="primary">保存</button></div></form></section></div>`}const field=(label,name,type='text',value='',extra='')=>`<div class="field"><label>${label}</label><${type==='textarea'?'textarea':'input'} name="${name}" ${type!=='textarea'?`type="${type}"`:''} value="${type==='textarea'?'':esc(value)}" ${extra}>${type==='textarea'?esc(value):''}</${type==='textarea'?'textarea':'input'}></div>`;
function add(kind,edit=''){if(kind==='task'){let t=data.tasks.find(x=>x.id===edit)||{};openModal(edit?'编辑任务':'新增任务',field('任务名称','name','text',t.name||'','required')+`<div class="date-row">${field('日期','date','date',t.date||today(),'required')}${field('时间','time','time',t.time||'09:00','required')}</div><div class="date-row"><div class="field"><label>分类</label><select name="category">${['工作','学习','生活','健康','个人成长'].map(x=>`<option ${t.category===x?'selected':''}>${x}</option>`)}</select></div><div class="field"><label>优先级</label><select name="priority">${['低','中','高'].map(x=>`<option ${t.priority===x?'selected':''}>${x}</option>`)}</select></div></div>${field('备注','note','textarea',t.note||'')}<label style="display:flex;gap:8px;font-size:13px"><input name="focus" type="checkbox" style="width:auto" ${t.focus?'checked':''}>设为今日重点</label>`,'task',edit)}else if(kind==='exercise')openModal('记录运动',`<div class="date-row">${field('运动类型','type','text','快走','required')}${field('日期','date','date',today(),'required')}</div><div class="date-row">${field('时长（分钟）','minutes','number','30','required min="1"')}${field('消耗（千卡）','calories','number','150','required min="0"')}</div>${field('运动感受','feeling','textarea','')}`,'exercise');else if(kind==='saving')openModal('新建存钱目标',field('目标名称','name','text','','required')+`<div class="date-row">${field('已存金额','saved','number','0','required min="0"')}${field('目标金额','target','number','10000','required min="1"')}</div>`,'saving');else if(kind==='habits')openModal('添加习惯',field('习惯名称','name','text','','required'),'habits');else if(kind==='book')openModal('添加阅读记录',field('书名','title','text','','required')+field('作者','author','text','','required')+`<div class="date-row"><div class="field"><label>状态</label><select name="status"><option>正在读</option><option>想读</option><option>已读</option></select></div>${field('进度 %','progress','number','0','min="0" max="100"')}</div>${field('评分 1-5','rating','number','4','min="1" max="5"')}${field('摘录与笔记','note','textarea','')}`,'book');else if(kind==='mood')openModal('写心情日记',`<div class="field"><label>今天的心情</label><select name="mood">${['开心','平静','充实','疲惫','焦虑','难过'].map(x=>`<option>${x}</option>`)}</select></div>${field('今天发生的事','event','textarea','')}${field('情绪原因','reason','textarea','')}${field('想对自己说的话','words','textarea','')}${field('三件感恩小事','gratitude','textarea','')}`,'mood')}
function showGuide(){guideRoot.innerHTML=`<div class="onboarding"><section class="guide"><div class="guide-art"><div class="window"></div><div class="plant" style="right:55px"></div></div><h2>欢迎来到薰衣簿</h2><p>先从首页勾选三件重要的事；在底部“打卡”记录运动与存钱，在“记录”里写下阅读、心情与任意时间段复盘。所有数据会自动保存在这台设备。</p><button class="primary full" data-finish-guide>开始今天</button></section></div>`}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.nav){current=b.dataset.nav;if(current==='check'&&!['exercise','saving','habits'].includes(tab))tab='exercise';if(current==='record'&&!['books','moods','review'].includes(tab))tab='books';render()}else if(b.dataset.add)add(b.dataset.add);else if(b.dataset.close!==undefined)modalRoot.innerHTML='';else if(b.dataset.toggleTask){let t=data.tasks.find(x=>x.id===b.dataset.toggleTask);t.done=!t.done;save();render();toast(t.done?'任务已完成':'已恢复为待完成')}else if(b.dataset.editTask)add('task',b.dataset.editTask);else if(b.dataset.deleteTask){data.tasks=data.tasks.filter(x=>x.id!==b.dataset.deleteTask);save();render();toast('任务已删除')}else if(b.dataset.quick){data.quick[b.dataset.quick]=!data.quick[b.dataset.quick];save();render();toast(data.quick[b.dataset.quick]?`${b.dataset.quick}打卡成功`:'已取消打卡')}else if(b.dataset.toggleHabit){let h=data.habits.find(x=>x.id===b.dataset.toggleHabit);h.done=!h.done;if(h.done)h.streak++;save();render();toast(h.done?'习惯打卡成功':'已取消打卡')}else if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.dataset.deleteRecord){let [k,i]=b.dataset.deleteRecord.split(':');data[k]=data[k].filter(x=>x.id!==i);save();render();toast('记录已删除')}else if(b.dataset.deposit){let a=prompt('本次存入金额');if(a&&Number(a)>0){let g=data.savings.find(x=>x.id===b.dataset.deposit);g.saved+=Number(a);data.savingLogs.push({id:id(),goalId:g.id,date:today(),amount:Number(a)});save();render();toast('已存入，离目标更近了')}}else if(b.dataset.quote!==undefined){data.quote++;save();render()}else if(b.dataset.calcReview!==undefined)calcReview();else if(b.dataset.clear!==undefined){if(confirm('确定清空所有模拟数据吗？此操作无法撤销。')){data={...seed(),tasks:[],quick:{运动:false,阅读:false,存钱:false,喝水:false,心情:false},habits:[],exercise:[],savings:[],savingLogs:[],books:[],moods:[],reviews:[]};save();render();toast('模拟数据已清零')}}else if(b.dataset.guide!==undefined)showGuide();else if(b.dataset.finishGuide!==undefined){localStorage.setItem(KEY+'-guided','1');guideRoot.innerHTML=''}else if(b.dataset.export!==undefined)exportData()});
document.addEventListener('input',e=>{if(e.target.id==='taskSearch'){search=e.target.value;renderPlan()}});document.addEventListener('change',e=>{if(e.target.id==='taskFilter'){filter=e.target.value;renderPlan()}});document.addEventListener('submit',e=>{if(e.target.id!=='entryForm')return;e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f),kind=e.target.dataset.kind,edit=e.target.dataset.edit;o.id=edit||id();if(kind==='task'){o.done=edit?data.tasks.find(x=>x.id===edit).done:false;o.focus=f.has('focus');data.tasks=edit?data.tasks.map(x=>x.id===edit?o:x):[...data.tasks,o]}if(kind==='exercise'){o.minutes=+o.minutes;o.calories=+o.calories;data.exercise.unshift(o)}if(kind==='saving'){o.saved=+o.saved;o.target=+o.target;data.savings.push(o)}if(kind==='habits')data.habits.push({id:o.id,name:o.name,streak:0,week:[0,0,0,0,0,0,0],done:false});if(kind==='book'){o.progress=+o.progress;o.rating=+o.rating;data.books.unshift(o)}if(kind==='mood'){o.date=today();data.moods.unshift(o)}save();modalRoot.innerHTML='';render();toast('已保存')});
function calcReview(){let s=document.querySelector('#reviewStart').value,e=document.querySelector('#reviewEnd').value;if(!s||!e||s>e){toast('请选择有效的时间段');return}let tasks=data.tasks.filter(x=>x.date>=s&&x.date<=e),ex=data.exercise.filter(x=>x.date>=s&&x.date<=e),mo=data.moods.filter(x=>x.date>=s&&x.date<=e),logs=data.savingLogs.filter(x=>x.date>=s&&x.date<=e),result=document.querySelector('#reviewResult');result.innerHTML=`<div class="summary-grid section"><div class="summary-item"><strong>${tasks.filter(x=>x.done).length}/${tasks.length}</strong><span>任务完成</span></div><div class="summary-item"><strong>${ex.reduce((n,x)=>n+x.minutes,0)} 分钟</strong><span>运动</span></div><div class="summary-item"><strong>¥${logs.reduce((n,x)=>n+x.amount,0)}</strong><span>期间存入</span></div><div class="summary-item"><strong>${mo.length} 天</strong><span>心情记录</span></div></div>${field('这段时间最满意的事','satisfied','textarea','')}${field('下一阶段想改善的事','improve','textarea','')}<button class="secondary full" id="saveReview">保存这次复盘</button>`;document.querySelector('#saveReview').onclick=()=>{data.reviews.unshift({id:id(),start:s,end:e,satisfied:document.querySelector('[name=satisfied]').value||'保持了自己的节奏',improve:document.querySelector('[name=improve]').value||'继续稳步前进'});save();render();toast('复盘已保存')}}function exportData(){let a=document.createElement('a'),blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download=`sunbook-${today()}.json`;a.click();URL.revokeObjectURL(a.href);toast('数据已导出')}
async function persistSnapshot(snapshot){try{let db=await openStorage();await writeSnapshot(db,snapshot);db.close()}catch(e){storageState='本机备份可恢复'}}function backupMenu(){modalRoot.innerHTML=`<div class="modal-wrap"><section class="modal" role="dialog" aria-modal="true"><header class="modal-head"><h2>手机本地备份</h2><button class="close" data-close aria-label="关闭">×</button></header><p style="font-size:13px;color:var(--muted);line-height:1.65;margin:0 0 18px">备份文件会下载到手机文件中，不依赖浏览器缓存。更换浏览器或清理数据后，也可以从这里恢复。</p><button class="primary full" data-export-now>导出手机备份</button><button class="secondary full" style="margin-top:9px" data-import-now>从手机备份恢复</button></section></div>`}function importData(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{let file=input.files&&input.files[0];if(!file)return;try{let restored=JSON.parse(await file.text()),required=['tasks','quick','habits','exercise','savings','savingLogs','books','moods','reviews'];if(!required.every(k=>Object.prototype.hasOwnProperty.call(restored,k)))throw Error('invalid backup');data=restored;save();modalRoot.innerHTML='';render();toast('手机备份已恢复')}catch(e){toast('备份文件格式不正确')}};input.click()}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.export!==undefined){e.stopImmediatePropagation();backupMenu()}else if(b.dataset.exportNow!==undefined){e.stopImmediatePropagation();exportData();modalRoot.innerHTML='';toast('手机备份已导出')}else if(b.dataset.importNow!==undefined){e.stopImmediatePropagation();modalRoot.innerHTML='';importData()}},true);render();if(!localStorage.getItem(KEY+'-guided'))showGuide();hydrateStorage();
const weatherState={place:'正在定位',temperature:'--',summary:'正在获取实时天气',code:null};function weatherIcon(code){if(code===0)return'☀';if([1,2,3].includes(code))return'⛅';if([45,48].includes(code))return'🌫';if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code))return'🌧';if([71,73,75,77,85,86].includes(code))return'❄';if([95,96,99].includes(code))return'⛈';return'☁'}function weatherText(code){if(code===0)return'晴朗';if([1,2,3].includes(code))return'多云';if([45,48].includes(code))return'有雾';if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code))return'有雨';if([71,73,75,77,85,86].includes(code))return'有雪';if([95,96,99].includes(code))return'雷雨';return'天气未知'}function updateWeatherUI(){let meta=document.querySelector('.sun-meta');if(!meta)return;let t=weatherState.temperature==='--'?'--':`${weatherState.temperature}°C`;meta.innerHTML=`<button class="weather-line" data-refresh-weather aria-label="刷新定位天气">${weatherIcon(weatherState.code)} ${t} · ${esc(weatherState.place)}</button><span>${esc(weatherState.summary)}</span>`}async function reversePlace(lat,lon){try{let r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`),j=await r.json();return j.city||j.locality||j.principalSubdivision||'当前位置'}catch(e){return'当前位置'}}async function fetchWeather(lat,lon,place){weatherState.place=place||'当前位置';weatherState.summary='天气加载中';updateWeatherUI();try{let r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,relative_humidity_2m&timezone=auto`),j=await r.json();weatherState.temperature=Math.round(j.current.temperature_2m);weatherState.code=j.current.weather_code;weatherState.summary=`${weatherText(weatherState.code)} · 湿度 ${j.current.relative_humidity_2m}%`;updateWeatherUI()}catch(e){weatherState.summary='天气暂时不可用';updateWeatherUI()}}async function ipWeather(){try{let r=await fetch('https://ipapi.co/json/'),j=await r.json();if(!j.latitude||!j.longitude)throw Error('location unavailable');fetchWeather(j.latitude,j.longitude,j.city||j.region||'网络定位')}catch(e){weatherState.place='未获取定位';weatherState.summary='点击天气文字重试';updateWeatherUI()}}function requestWeather(){weatherState.place='正在定位';weatherState.summary='请求手机定位';updateWeatherUI();if(!navigator.geolocation)return ipWeather();navigator.geolocation.getCurrentPosition(async p=>{let place=await reversePlace(p.coords.latitude,p.coords.longitude);fetchWeather(p.coords.latitude,p.coords.longitude,place)},()=>ipWeather(),{enableHighAccuracy:false,timeout:7000,maximumAge:600000})}const originalRender=render;render=function(){originalRender();updateWeatherUI()};document.addEventListener('click',e=>{if(e.target.closest('[data-refresh-weather]'))requestWeather()},true);render();requestWeather();
function ipWeather(){fetch('https://ipwho.is/').then(r=>r.json()).then(j=>{if(!j.success||!j.latitude||!j.longitude)throw Error('location unavailable');fetchWeather(j.latitude,j.longitude,j.city||j.region||'网络定位')}).catch(()=>{weatherState.place='未获取定位';weatherState.summary='点击天气文字重试';updateWeatherUI()})}let deferredInstall=null;function configurePwa(){let apple=document.querySelector('link[rel="apple-touch-icon"]'),link=document.querySelector('link[rel="manifest"]'),clean=location.href.split('#')[0].split('?')[0],scope;try{scope=new URL('.',clean).href}catch(e){scope=clean}let manifest={id:location.pathname||'sunbook',name:'薰衣簿 · 生活与成长',short_name:'薰衣簿',description:'个人生活与成长工作台',lang:'zh-CN',start_url:clean,scope,display:'standalone',display_override:['standalone','minimal-ui'],orientation:'any',background_color:'#FBF8F3',theme_color:'#8267A8',icons:[{src:apple.getAttribute('href'),sizes:'any',type:'image/svg+xml',purpose:'any maskable'}]};link.href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(manifest))}function showInstallGuide(){modalRoot.innerHTML=`<div class="modal-wrap"><section class="modal" role="dialog" aria-modal="true"><header class="modal-head"><h2>添加到华为桌面</h2><button class="close" data-close aria-label="关闭">×</button></header><div class="install-guide"><div class="install-step"><b>1</b><span>使用华为浏览器打开本站<small>保持网络连接，等待页面完全加载</small></span></div><div class="install-step"><b>2</b><span>点击浏览器右下角菜单<small>选择“添加至桌面”或“添加到主屏幕”</small></span></div><div class="install-step"><b>3</b><span>确认名称“薰衣簿”并添加<small>之后从桌面图标打开，即为全屏 standalone 模式</small></span></div></div><button class="primary full" data-close>知道了</button></section></div>`}function decoratePwa(){if(current!=='mine')return;let list=document.querySelector('.settings-list');if(!list||list.querySelector('[data-install-app]'))return;let button=document.createElement('button');button.className='setting';button.dataset.installApp='';button.innerHTML=`<div><span>添加到手机桌面</span><small>全屏运行 · 适配 Mate X6</small></div>${icon('home')}`;list.prepend(button);let backup=list.querySelector('[data-export]');if(backup){backup.querySelector('span').textContent='手机本地备份';backup.querySelector('small').textContent='导出或恢复手机文件' }}configurePwa();window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;decoratePwa()});window.addEventListener('appinstalled',()=>{deferredInstall=null;toast('薰衣簿已添加到桌面')});document.addEventListener('click',async e=>{let button=e.target.closest('[data-install-app]');if(!button)return;e.stopImmediatePropagation();if(!deferredInstall)return showInstallGuide();deferredInstall.prompt();let choice=await deferredInstall.userChoice;if(choice.outcome==='accepted')toast('正在添加到手机桌面');deferredInstall=null},true);const pwaRender=render;render=function(){pwaRender();decoratePwa()};render();
</script>
